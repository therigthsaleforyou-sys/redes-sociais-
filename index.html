<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Social Hub</h1>
    <p>Escolhe uma categoria para acessar suas redes sociais</p>
  </header>

  <main class="categories">
    <div class="category" onclick="abrirCategoria('gerais')">Amigos / Gerais</div>
    <div class="category" onclick="abrirCategoria('profissionais')">Profissionais</div>
    <div class="category" onclick="abrirCategoria('videos')">Vídeos</div>
    <div class="category" onclick="abrirCategoria('fotos')">Fotos / Multimídia</div>
    <div class="category" onclick="abrirCategoria('mensagens')">Mensagens / Chats</div>
    <div class="category" onclick="abrirCategoria('microblogging')">Microblogging</div>
    <div class="category" onclick="abrirCategoria('nichos')">Nicho / Interesses</div>
    <div class="category" onclick="abrirCategoria('regionais')">Regionais</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
