<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Social Hub</h1>
  <div id="info">
    <span id="dataHora"></span>
    <span id="cidade"></span>
  </div>
</header>

<section>
  <h2>Apps da moda 🔥</h2>
  <div class="grid">
    <button onclick="abrirApp(apps.instagram)">Instagram</button>
    <button onclick="abrirApp(apps.tiktok)">TikTok</button>
    <button onclick="abrirApp(apps.threads)">Threads</button>
  </div>
</section>

<section>
  <h2>Categorias</h2>
  <div class="grid">
    <button onclick="abrirCategoria('mensagens')">Mensagens</button>
    <button onclick="abrirCategoria('redes')">Redes Sociais</button>
    <button onclick="abrirCategoria('video')">Vídeo</button>
    <button onclick="abrirCategoria('trabalho')">Trabalho</button>
    <button onclick="abrirCategoria('gaming')">Gaming</button>
    <button onclick="abrirCategoria('compras')">Compras</button>
    <button onclick="abrirCategoria('dating')">Dating</button>
    <button onclick="abrirCategoria('outros')">Outros</button>
  </div>
</section>

<!-- MODAL PARA APP NÃO INSTALADA -->
<div id="modalApp" class="hidden">
  <div class="modal-box">
    <h3>App não instalada</h3>
    <p>Como queres continuar?</p>
    <div class="grid">
      <button id="btnPlayStore">Play Store</button>
      <button id="btnBrowser">Browser</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
