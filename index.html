<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Redes Sociais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 data-i18n="title"></h1>

<section>
  <h2 data-i18n="suggested"></h2>
  <button class="btn">Instagram</button>
  <button class="btn">WhatsApp</button>
  <button class="btn">TikTok</button>
</section>

<section>
  <h2 data-i18n="trending"></h2>
  <button class="btn">Threads</button>
  <button class="btn">BeReal</button>
</section>

<button class="btn" onclick="document.getElementById('langModal').classList.add('show')">
  🌍 <span data-i18n="chooseLang"></span>
</button>

<!-- Modal Idioma -->
<div id="langModal" class="modal">
  <div class="modal-content">
    <h3 data-i18n="chooseLang"></h3>
    <button class="btn" onclick="setLanguage('pt')">Português</button>
    <button class="btn" onclick="setLanguage('en')">English</button>
  </div>
</div>

<script src="lang.js"></script>
<script src="script.js"></script>
</body>
</html>
