<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes Sociais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="categoriaTitulo">Redes Sociais</h1>
    <button onclick="voltar()">⬅ Voltar</button>
  </header>

  <main id="socialList" class="categories"></main>

  <script src="script.js"></script>
  <script>
    // Todas as redes sociais por categoria
    const categorias = {
      gerais: [
        {nome:"Facebook", app:"fb://profile", web:"https://www.facebook.com", play:"https://play.google.com/store/apps/details?id=com.facebook.katana"},
        {nome:"Instagram", app:"instagram://user?username=instagram", web:"https://www.instagram.com", play:"https://play.google.com/store/apps/details?id=com.instagram.android"},
        {nome:"TikTok", app:"snssdk1233://", web:"https://www.tiktok.com", play:"https://play.google.com/store/apps/details?id=com.zhiliaoapp.musically"},
        {nome:"Reddit", app:"reddit://", web:"https://www.reddit.com", play:"https://play.google.com/store/apps/details?id=com.reddit.frontpage"}
      ],
      profissionais: [
        {nome:"LinkedIn", app:"linkedin://", web:"https://www.linkedin.com", play:"https://play.google.com/store/apps/details?id=com.linkedin.android"},
        {nome:"Xing", app:"xing://", web:"https://www.xing.com", play:"https://play.google.com/store/apps/details?id=com.xing.android"}
      ],
      videos: [
        {nome:"YouTube", app:"vnd.youtube://", web:"https://www.youtube.com", play:"https://play.google.com/store/apps/details?id=com.google.android.youtube"},
        {nome:"Twitch", app:"twitch://", web:"https://www.twitch.tv", play:"https://play.google.com/store/apps/details?id=tv.twitch.android.app"},
        {nome:"Vimeo", app:"vimeo://", web:"https://vimeo.com", play:"https://play.google.com/store/apps/details?id=com.vimeo.android.videoapp"}
      ],
      fotos: [
        {nome:"Pinterest", app:"pinterest://", web:"https://www.pinterest.com", play:"https://play.google.com/store/apps/details?id=com.pinterest"},
        {nome:"Flickr", app:"flickr://", web:"https://www.flickr.com", play:"https://play.google.com/store/apps/details?id=com.yahoo.mobile.client.android.flickr"}
      ],
      mensagens: [
        {nome:"WhatsApp", app:"whatsapp://", web:"https://web.whatsapp.com", play:"https://play.google.com/store/apps/details?id=com.whatsapp"},
        {nome:"Telegram", app:"tg://", web:"https://web.telegram.org", play:"https://play.google.com/store/apps/details?id=org.telegram.messenger"},
        {nome:"Messenger", app:"fb-messenger://", web:"https://www.messenger.com", play:"https://play.google.com/store/apps/details?id=com.facebook.orca"}
      ],
      microblogging: [
        {nome:"Twitter", app:"twitter://", web:"https://twitter.com", play:"https://play.google.com/store/apps/details?id=com.twitter.android"},
        {nome:"Mastodon", app:"mastodon://", web:"https://mastodon.social", play:"https://play.google.com/store/apps/details?id=org.joinmastodon.android"}
      ],
      nichos: [
        {nome:"Strava", app:"strava://", web:"https://www.strava.com", play:"https://play.google.com/store/apps/details?id=com.strava"},
        {nome:"Goodreads", app:"goodreads://", web:"https://www.goodreads.com", play:"https://play.google.com/store/apps/details?id=com.goodreads"}
      ],
      regionais: [
        {nome:"Weibo", app:"sinaweibo://", web:"https://weibo.com", play:"https://play.google.com/store/apps/details?id=com.sina.weibo"},
        {nome:"VK", app:"vk://", web:"https://vk.com", play:"https://play.google.com/store/apps/details?id=com.vkontakte.android"}
      ]
    };

    // Categoria do URL
    const urlParams = new URLSearchParams(window.location.search);
    const cat = urlParams.get('cat') || 'gerais';
    document.getElementById('categoriaTitulo').innerText = cat.charAt(0).toUpperCase() + cat.slice(1);

    const socialList = document.getElementById('socialList');

    categorias[cat].forEach(social => {
      const div = document.createElement('div');
      div.className = 'category';
      div.innerText = social.nome;
      div.onclick = () => abrirRede(social);
      socialList.appendChild(div);
    });

    // Função para abrir rede social com memorizar escolha browser
    function abrirRede(social) {
      const appLink = social.app;
      const webLink = social.web;
      const playLink = social.play;
      const key = `socialHub_${social.nome}`;

      // Se já escolheu browser, abre direto
      if (sessionStorage.getItem(key) === 'browser') {
        window.location.href = webLink;
        return;
      }

      const now = Date.now();
      const timeout = 1500;

      // Tenta abrir app via deep link
      window.location = appLink;

      // Se não abrir, mostra prompt
      setTimeout(() => {
        const delta = Date.now() - now;
        if (delta < timeout + 200) {
          const escolha = confirm("App não detectada. Clique 'OK' para abrir no browser ou 'Cancelar' para voltar à página inicial.");
          if (escolha) {
            sessionStorage.setItem(key, 'browser');
            window.location.href = webLink;
          } else {
            window.location.href = 'index.html';
          }
        }
      }, timeout);
    }

    function voltar() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
