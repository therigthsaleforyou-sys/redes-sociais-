<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categoria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 id="tituloCategoria">Categoria</h1>
</header>

<main id="socialList" class="grid">
  <!-- Botões serão carregados via script.js -->
</main>

<!-- MODAL PARA APP NÃO INSTALADA (mesmo do index) -->
<div id="modalApp" class="hidden">
  <div class="modal-box">
    <h3>App não instalada</h3>
    <p>Como queres continuar?</p>
    <div class="grid">
      <button id="btnPlayStore">Play Store</button>
      <button id="btnBrowser">Browser</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
/* CATEGORIA DINÂMICA */
const params = new URLSearchParams(window.location.search);
const categoria = params.get("cat") || "gerais";
document.getElementById("tituloCategoria").innerText = categoria.toUpperCase();

const socialList = document.getElementById("socialList");
const categorias = {
  gerais: [
    apps.instagram,
    apps.tiktok,
    apps.threads
  ],
  mensagens: [
    apps.whatsapp,
    apps.telegram
  ],
  video: [
    apps.youtube
  ]
};

categorias[categoria]?.forEach(social => {
  const btn = document.createElement("button");
  btn.innerText = social.nome;
  btn.onclick = () => abrirApp(social);
  socialList.appendChild(btn);
});
</script>
</body>
</html>
