<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes Sociais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <h1 id="categoriaTitulo">Redes Sociais</h1>
  <button onclick="voltar()">⬅ Voltar</button>
</header>

<main id="socialList" class="categories"></main>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3>App não instalada</h3>
    <p>Como queres continuar?</p>
    <button onclick="abrirBrowser()">🌐 Browser</button>
    <button onclick="abrirPlayStore()">▶ Play Store</button>
    <button class="close" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
/* =========================
   DADOS DAS REDES
========================= */
const categorias = {
  gerais: [
    {nome:"Facebook", app:"fb://", web:"https://www.facebook.com", play:"https://play.google.com/store/apps/details?id=com.facebook.katana"},
    {nome:"Instagram", app:"instagram://", web:"https://www.instagram.com", play:"https://play.google.com/store/apps/details?id=com.instagram.android"},
    {nome:"TikTok", app:"snssdk1233://", web:"https://www.tiktok.com", play:"https://play.google.com/store/apps/details?id=com.zhiliaoapp.musically"}
  ],
  mensagens: [
    {nome:"WhatsApp", app:"whatsapp://", web:"https://web.whatsapp.com", play:"https://play.google.com/store/apps/details?id=com.whatsapp"},
    {nome:"Telegram", app:"tg://", web:"https://web.telegram.org", play:"https://play.google.com/store/apps/details?id=org.telegram.messenger"}
  ]
};

/* =========================
   CATEGORIA ATUAL
========================= */
const params = new URLSearchParams(window.location.search);
const cat = params.get("cat") || "gerais";
document.getElementById("categoriaTitulo").innerText =
  cat.charAt(0).toUpperCase() + cat.slice(1);

const list = document.getElementById("socialList");

categorias[cat].forEach(social => {
  const div = document.createElement("div");
  div.className = "category";
  div.innerText = social.nome;
  div.onclick = () => abrirRede(social);
  list.appendChild(div);
});

/* =========================
   CONTROLO DE ABERTURA
========================= */
let socialAtual = null;

function abrirRede(social) {
  socialAtual = social;
  const key = "browser_" + social.nome;

  // Se já escolheu browser antes
  if (sessionStorage.getItem(key) === "browser") {
    window.location.href = social.web;
    return;
  }

  const start = Date.now();
  window.location.href = social.app;

  setTimeout(() => {
    if (Date.now() - start < 1600) {
      mostrarModal();
    }
  }, 1500);
}

/* =========================
   MODAL
========================= */
function mostrarModal() {
  document.getElementById("modal").classList.remove("hidden");
}

function fecharModal() {
  document.getElementById("modal").classList.add("hidden");
}

function abrirBrowser() {
  sessionStorage.setItem("browser_" + socialAtual.nome, "browser");
  window.location.href = socialAtual.web;
}

function abrirPlayStore() {
  window.location.href = socialAtual.play;
}

function voltar() {
  window.location.href = "index.html";
}
</script>

<style>
/* MODAL */
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-box {
  background: white;
  padding: 20px;
  border-radius: 16px;
  width: 85%;
  max-width: 300px;
  text-align: center;
}

.modal-box button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 12px;
  border: none;
  font-weight: bold;
}

.modal-box button.close {
  background: #ccc;
}

.hidden {
  display: none;
}
</style>

</body>
</html>
